[package]
name    = "idp-federation"
version = "0.1.0"
edition = "2021"

[dependencies]
serde       = { workspace = true }
serde_json  = { workspace = true }
tokio       = { workspace = true }
tracing     = { workspace = true }
uuid        = { workspace = true }
time        = { workspace = true }
sqlx        = { workspace = true }
axum        = { workspace = true }
reqwest     = { workspace = true }
url         = "2"
urlencoding = "2"

activitypub     = { workspace = true }
http-signatures = { workspace = true }
jwt-utils       = { workspace = true }

idp-broker   = { path = "../broker",   package = "idp-broker" }
idp-config   = { path = "../config",   package = "idp-config" }
idp-db       = { path = "../db",       package = "idp-db" }
idp-realtime = { path = "../realtime", package = "idp-realtime" }
idp-state    = { path = "../state",    package = "idp-state" }
idp-storage  = { path = "../storage",  package = "idp-storage" }
