[package]
name    = "idp-server"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "idp-server"
path = "src/main.rs"

[dependencies]
serde      = { workspace = true }
serde_json = { workspace = true }
tokio      = { workspace = true }
tracing    = { workspace = true }
axum       = { workspace = true }
axum-extra = { workspace = true }
sqlx       = { workspace = true }
jwt-utils  = { workspace = true }

observability = { workspace = true }
tower-http = { version = "0.6", features = ["cors", "trace"] }
dotenvy    = "0.15"
anyhow     = "1"

idp-config = { path = "../config", package = "idp-config" }
idp-db     = { path = "../db",     package = "idp-db" }
idp-oidc   = { path = "../oidc",   package = "idp-oidc" }
