[workspace]
resolver = "2"
members = [
    "crates/auth",
    "crates/broker",
    "crates/config",
    "crates/db",
    "crates/e2ee",
    "crates/email",
    "crates/federation",
    "crates/messaging",
    "crates/presence",
    "crates/realtime",
    "crates/server",
    "crates/social",
    "crates/state",
    "crates/storage",
    "crates/totp",
    "crates/dev-inject-data",
]

[workspace.dependencies]
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror  = "2"
tokio      = { version = "1", features = ["full"] }
tracing    = "0.1"
uuid       = { version = "1", features = ["v4", "serde"] }
time       = { version = "0.3", features = ["serde", "formatting"] }
sqlx       = { version = "0.8", features = ["postgres", "runtime-tokio", "uuid", "time", "macros"] }
axum       = { version = "0.8", features = ["macros", "form", "ws"] }
dashmap    = "6"
futures-util  = "0.3"
tokio-stream  = "0.1"
reqwest    = { version = "0.12", features = ["json"] }
axum-extra = { version = "0.10", features = ["cookie-signed"] }
nanoid     = "0.4"
async-trait = "0.1"
lettre     = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1-rustls-tls", "builder"] }
totp-rs    = { version = "5", features = ["otpauth"] }
hmac       = "0.12"
sha2       = "0.10"
subtle     = "2"
base32     = "0.5"

# Shared crates from core-libs
jwt-utils       = { git = "https://github.com/Pina-i/core-libs.git", package = "jwt-utils" }
common-types    = { git = "https://github.com/Pina-i/core-libs.git", package = "common-types" }
observability   = { git = "https://github.com/Pina-i/core-libs.git", package = "observability" }
activitypub     = { git = "https://github.com/Pina-i/core-libs.git", package = "activitypub" }
http-signatures = { git = "https://github.com/Pina-i/core-libs.git", package = "http-signatures" }
