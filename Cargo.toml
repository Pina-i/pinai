[workspace]
resolver = "2"
members = [
    "crates/*",
    "identity-provider/crates/*",
]

[workspace.package]
version = "0.1.0"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror  = "2"
tokio      = { version = "1", features = ["full"] }
tokio-util = { version = "0.7" }
tracing    = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry"] }
uuid       = { version = "1", features = ["v4", "serde"] }
time       = { version = "0.3", features = ["serde", "formatting", "parsing"] }
base64     = "0.22"
ed25519-dalek = "2"
sqlx       = { version = "0.8", features = ["postgres", "runtime-tokio", "uuid", "time", "macros"] }
axum       = { version = "0.8", features = ["macros", "form", "ws"] }
dashmap    = "6"
futures-util  = "0.3"
futures-core  = "0.3"
bytes         = "1"
tokio-stream  = "0.1"
# rustls on the system's roots, as the S3 client does: the runtime image carries no OpenSSL.
reqwest    = { version = "0.12", default-features = false, features = ["json", "charset", "http2", "rustls-tls-native-roots"] }
axum-extra = { version = "0.10", features = ["cookie-signed"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
nanoid     = "0.4"
async-trait = "0.1"
anyhow     = "1"
http-body-util = "0.1"
tower      = { version = "0.5", features = ["util"] }
url        = "2"
proptest   = "1"
wiremock   = "0.6"
lettre     = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1-rustls-tls", "builder"] }
totp-rs    = { version = "5", features = ["otpauth"] }
hmac       = "0.12"
sha2       = "0.10"
hkdf          = "0.12"
subtle     = "2"
base32     = "0.5"
argon2     = "0.5"
rand       = "0.8"
deunicode  = "1"
askama     = "0.16"

# Shared crates (were the core-libs repo, pulled in as unpinned git deps)
jwt-utils       = { path = "crates/jwt-utils" }
observability   = { path = "crates/observability" }
activitypub     = { path = "crates/activitypub" }
http-signatures = { path = "crates/http-signatures" }
federation-transport = { path = "crates/federation-transport" }
