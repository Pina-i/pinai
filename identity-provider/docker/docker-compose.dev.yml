# Dev override for Linux. Apply on top of docker-compose.yml:
#
#   docker compose -f docker/docker-compose.yml \
#                  -f docker/docker-compose.dev.yml \
#                  --project-name pinai-alice up -d --build
#
# Only changes the idp service: switches to Dockerfile.dev (debug profile) and
# enables tty + verbose logs for easier inner-loop work.

services:
  idp:
    build:
      context: ../..
      dockerfile: identity-provider/docker/Dockerfile.dev
    tty: true
