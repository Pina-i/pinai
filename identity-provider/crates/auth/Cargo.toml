[package]
name    = "idp-auth"
version = "0.1.0"
edition = "2021"

[dependencies]
application = { path = "../application", package = "idp-application" }
domain = { path = "../domain", package = "idp-domain" }
serde        = { workspace = true }
serde_json   = { workspace = true }
thiserror    = { workspace = true }
tokio        = { workspace = true }
tracing      = { workspace = true }
uuid         = { workspace = true }
time         = { workspace = true }
axum         = { workspace = true }
axum-extra   = { workspace = true }
sqlx         = { workspace = true }
common-types = { workspace = true }
jwt-utils    = { workspace = true }
idp-config     = { path = "../config",     package = "idp-config" }
idp-db         = { path = "../db",         package = "idp-db" }
idp-federation = { path = "../federation", package = "idp-federation" }
idp-state      = { path = "../state",      package = "idp-state" }
idp-storage    = { path = "../storage",    package = "idp-storage" }
argon2    = "0.5"
rand      = "0.8"
base64ct  = { version = "1", features = ["alloc"] }
hmac      = { workspace = true }
sha2      = { workspace = true }
subtle    = { workspace = true }
idp-email = { path = "../email", package = "idp-email" }
idp-totp  = { path = "../totp",  package = "idp-totp" }
activitypub     = { workspace = true }
http-signatures = { workspace = true }
reqwest         = { workspace = true }
urlencoding     = "2"
nanoid          = { workspace = true }
