[package]
name    = "idp-infrastructure"
version = "0.1.0"
edition = "2024"
license.workspace = true

[lib]
name = "infrastructure"

# Adapters implementing the domain's ports: SQLx, Redis, outbound HTTP.
[dependencies]
activitypub          = { workspace = true }
argon2               = { workspace = true }
anyhow               = { workspace = true }
async-trait          = { workspace = true }
base32               = { workspace = true }
base64               = { workspace = true }
bytes                = { workspace = true }


domain               = { package = "idp-domain", path = "../domain" }
ed25519-dalek        = { workspace = true }
federation-transport = { workspace = true }
futures-core         = { workspace = true }
futures-util         = { workspace = true }
hmac                 = { workspace = true }
jwt-utils            = { workspace = true }
lettre               = { workspace = true }

rand                 = { workspace = true }
reqwest              = { workspace = true, features = ["stream"] }
serde_json           = { workspace = true }
sha2                 = { workspace = true }
serde                = { workspace = true }
sqlx                 = { workspace = true }
time                 = { workspace = true }
totp-rs              = { workspace = true }
thiserror            = { workspace = true }
tokio                = { workspace = true }
tokio-util           = { workspace = true, features = ["io"] }
tracing              = { workspace = true }
url                  = { workspace = true }
uuid                 = { workspace = true }

# The live connections, shared with `api`.
connections = { package = "idp-connections", path = "../connections" }

# Redis, and the S3-compatible object store.
aws-config           = { version = "1", features = ["behavior-version-latest"] }
aws-credential-types = "1"
aws-sdk-s3           = "1"
redis                = { version = "0.27", features = ["aio", "tokio-comp", "connection-manager"] }

[dev-dependencies]
domain          = { package = "idp-domain", path = "../domain", features = ["test-utils"] }
http-signatures = { workspace = true }
tokio    = { workspace = true }
uuid     = { workspace = true }
wiremock = { workspace = true }

[features]
# Tests that need Docker (Postgres, RustFS); run by `make test-integration`.
integration = []

# Client documents, served by wiremock: no Docker.
[[test]]
name = "clients"
path = "tests/clients/main.rs"

[[test]]
name              = "postgres"
path              = "tests/postgres/main.rs"
required-features = ["integration"]

[[test]]
name              = "storage"
path              = "tests/storage/main.rs"
required-features = ["integration"]
