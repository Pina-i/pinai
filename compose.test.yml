# Throwaway services for the Docker-gated tests — never an instance's database or Redis.
# `make test-integration` starts them under the `pinai-test` project; data lives in RAM.
# The default port stays clear of Alice's (5432) and Bob's (5433) dev Postgres.
services:
  postgres-test:
    image: postgres:18
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test
    command: ["postgres", "-c", "fsync=off", "-c", "full_page_writes=off", "-c", "max_connections=500"]
    ports: ["${TEST_PG_PORT:-55432}:5432"]
    tmpfs: ["/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test"]
      interval: 1s
      timeout: 3s
      retries: 30

  redis-test:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["${TEST_REDIS_PORT:-56479}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 30
