name: pinai-idp

services:
  postgres:
    image: postgres:18
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  rustfs:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${STORAGE_SECRET_KEY:-rustfsadmin}
    volumes:
      - rustfs-data:/data
      - rustfs-logs:/logs
    ports:
      - "${RUSTFS_PORT:-9000}:9000"
      - "${RUSTFS_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 30s

  # Dev SMTP catcher — visit MAILPIT_UI_PORT to inspect captured emails.
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"

  # Mints the instance's Ed25519 key on first boot, then never touches it. The key
  # signs JWTs, federation HTTP Signatures and E2EE device attestations, so it is
  # the instance's whole identity: back up IDP_KEYS_DIR with the database, because
  # losing it cannot be recovered from. openssl emits the PKCS#8 PEM the IdP reads.
  # The production image runs as 65532, so the key is group-readable by it, an
  # existing one included; its owner stays the directory's.
  idp-keygen:
    image: alpine/openssl:3.5.8
    restart: "no"
    entrypoint: ["sh", "-c"]
    command:
      - >-
        if [ -f /keys/ed25519.pem ]; then
          echo "instance key present, keeping it";
        else
          openssl genpkey -algorithm ed25519 -out /keys/ed25519.pem &&
          chown "$$(stat -c '%u' /keys)" /keys/ed25519.pem &&
          echo "generated a new instance key";
        fi &&
        chgrp 65532 /keys/ed25519.pem &&
        chmod 640 /keys/ed25519.pem
    volumes:
      - ${IDP_KEYS_DIR:-./identity-provider/keys/default}:/keys

  idp:
    build:
      context: .
      dockerfile: identity-provider/docker/Dockerfile
    env_file: .env
    network_mode: host
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@localhost:${POSTGRES_PORT:-5432}/${POSTGRES_DB}
      JWT_PRIVATE_KEY_PATH: /run/secrets/ed25519.pem
      STORAGE_ENDPOINT: http://localhost:${RUSTFS_PORT:-9000}
      REDIS_URL: redis://localhost:${REDIS_PORT:-6379}
    volumes:
      - ${IDP_KEYS_DIR:-./identity-provider/keys/default}:/run/secrets:ro
    depends_on:
      idp-keygen:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_healthy

volumes:
  pgdata:
  redis-data:
  rustfs-data:
  rustfs-logs:
