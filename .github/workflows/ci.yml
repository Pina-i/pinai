name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  # Run workflow, in the Actions tab: only tags the branch's head, and the tag's run publishes.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to tag: idp-api's (X.Y.Z, from main only) or a release candidate of it (X.Y.Z-rc.N)"
        required: true
        type: string

permissions:
  contents: read

# A newer push waits for the run under way rather than racing it: edge is always main's latest.
# The event keeps a manual run apart from main's pushes, whose pending run it would cancel.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The toolchain of the Dockerfiles' cargo-chef image.
  RUSTUP_TOOLCHAIN: "1.98.1"
  IMAGE: ghcr.io/pina-i/pinai-idp

jobs:
  check:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component clippy,rustfmt
      # On every run, not only tags: a release PR opening a minor fails until compose names it.
      - name: Check the version against the tag and compose's default image
        env:
          TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: sh scripts/check-release-version.sh "$TAG"
      # Saved from main only: another ref's cache would evict main's, which every run reads.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: make check-all

  # Each platform on a native runner, pushed by digest (pull requests only build);
  # publish joins them under the tags.
  image:
    needs: check
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # GitHub detects the license as AGPL-3.0, which can't say "or later": named here.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          labels: org.opencontainers.image.licenses=AGPL-3.0-or-later
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: identity-provider/docker/Dockerfile
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}
          # Written from main only, as rust-cache is; pull requests and tags read main's.
          cache-from: type=gha,scope=idp-${{ matrix.arch }}
          cache-to: ${{ github.ref == 'refs/heads/main' && format('type=gha,scope=idp-{0},mode=max', matrix.arch) || '' }}
      - name: Keep the digest for publish
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # main: edge and sha-<short>. A tag: 0.1.0, 0.1 and latest; a release candidate
      # (v0.2.0-rc.1) only its own version.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=edge,branch=main
            type=sha,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          annotations: org.opencontainers.image.licenses=AGPL-3.0-or-later
      - id: manifest
        name: Join the platforms under the tags
        working-directory: ${{ runner.temp }}/digests
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          args=()
          while IFS= read -r tag; do args+=(--tag "$tag"); done < <(jq -r '.tags[]' <<<"$DOCKER_METADATA_OUTPUT_JSON")
          while IFS= read -r note; do args+=(--annotation "$note"); done < <(jq -r '.annotations[]' <<<"$DOCKER_METADATA_OUTPUT_JSON")
          for digest in *; do args+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create "${args[@]}"
          docker buildx imagetools inspect "$IMAGE:$VERSION"
          echo "digest=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)" >> "$GITHUB_OUTPUT"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true

  # The deploy bundle, its PINAI_VERSION pinned to this release, once the image exists.
  release:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Package the deploy bundle
        run: |
          version=${GITHUB_REF_NAME#v}
          case "$version" in
            *-*) pin=$version ;;
            *) pin=${version%.*} ;;
          esac
          bundle="$RUNNER_TEMP/bundle"
          mkdir -p "$bundle"
          git archive --prefix=pinai/ HEAD:deploy | tar -x -C "$bundle"
          cp LICENSE "$bundle/pinai/LICENSE"
          sed -i "s/\${PINAI_VERSION:-[^}]*}/\${PINAI_VERSION:-$pin}/" "$bundle/pinai/compose.yaml"
          grep -qF "\${PINAI_VERSION:-$pin}" "$bundle/pinai/compose.yaml"
          tar -C "$bundle" -czf pinai-deploy.tar.gz pinai
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          prerelease=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease=(--prerelease); fi
          # release-plz's section of the version; a release candidate shows its final's, if any.
          version=${GITHUB_REF_NAME#v}
          notes=(--generate-notes)
          if [[ -f CHANGELOG.md ]]; then
            awk -v head="## [${version%%-*}]" '/^## \[/ { found = index($0, head) == 1; next } found' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
            if [[ -s "$RUNNER_TEMP/notes.md" ]]; then notes=(--notes-file "$RUNNER_TEMP/notes.md"); fi
          fi
          gh release create "$GITHUB_REF_NAME" pinai-deploy.tar.gz \
            --verify-tag "${notes[@]}" --title "$GITHUB_REF_NAME" "${prerelease[@]}"

  # A run by hand: tags the branch's head as the GitHub App, since a tag GITHUB_TOKEN creates
  # starts no run.
  tag:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      # Checked before tagging too: a refused tag would stay behind.
      - name: Check the version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ "$VERSION" != *-* && "$GITHUB_REF" != refs/heads/main ]]; then
            echo "::error::$VERSION is a release: run from main, not $GITHUB_REF_NAME"
            exit 1
          fi
          sh scripts/check-release-version.sh "v$VERSION"
      - id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_PLZ_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_PRIVATE_KEY }}
          permission-contents: write
      - name: Tag the commit
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          VERSION: ${{ inputs.version }}
        run: gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/v$VERSION" -f sha="$GITHUB_SHA"
